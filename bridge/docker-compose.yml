# term-bridge-relay — the home-server rendezvous for remote terminal access.
#
# SECURITY: the relay trusts nginx to terminate mutual TLS and pass the client
# cert CN in X-Client-Cert-CN. The port defaults to loopback ONLY (127.0.0.1).
# Only expose it on the LAN (RELAY_BIND=0.0.0.0 in .env) when nginx is on another
# host — and ONLY together with edge_token set in config.toml plus a firewall
# limiting the port to the nginx host. Never port-forward this port on the router.
#
# The image builds for the host's architecture, so build on each machine (this
# Linux server); do not copy the image across architectures.

services:
  relay:
    build:
      context: .
      dockerfile: deploy/Containerfile
    image: localhost/term-bridge-relay:latest
    container_name: term-bridge-relay
    restart: unless-stopped
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8765}:8765"
    volumes:
      - ./config.toml:/etc/term-bridge-relay/config.toml:ro,Z
      - relay-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
