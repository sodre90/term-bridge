# Home-server vhost for term-bridge-relay. Terminates mutual TLS for BOTH the Mac agent
# and app devices on your public DNS name, and proxies to the loopback relay.
#
# This `map` must live in the http{} context (not inside server{}):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# This `limit_req_zone` must also live in the http{} context:
#
#   limit_req_zone $binary_remote_addr zone=term_bridge_device_pair:10m rate=30r/m;

# A brand-new agent (no cert yet) registers through the separate, no-mTLS
# vhost in nginx-term-bridge-relay-bootstrap.conf — this vhost's ssl_verify_client is
# optional — agents present a cert, self-service-paired devices don't — but
# the relay never trusts a CN without nginx also confirming
# X-Client-Cert-Verify: SUCCESS (see internal/relay/relay.go's
# verifiedAgentTenant).

server {
    listen 443 ssl;
    http2 on;
    server_name term-bridge.example.com;            # your home-server DNS name

    ssl_certificate     /etc/nginx/certs/term-bridge/server.crt;
    ssl_certificate_key /etc/nginx/certs/term-bridge/server.key;

    # Mutual TLS: agent + device certs are signed by this one CA. Devices
    # paired via /devices/pair never get a client cert at all -- verification
    # must therefore be optional, not mandatory. Because it's optional, nginx
    # forwards X-Client-Cert-CN for ANY presented certificate, verified or
    # not (e.g. a trivial self-signed one) -- so it also forwards
    # X-Client-Cert-Verify, and every Go-side agent-CN check
    # (verifiedAgentTenant in internal/relay/relay.go) requires it to read
    # exactly "SUCCESS" before trusting the CN at all.
    ssl_client_certificate /etc/nginx/certs/term-bridge/client-ca.crt;
    ssl_verify_client      optional;

    # --- TLS hardening: pin modern protocols/ciphers instead of relying on
    # nginx build defaults, which vary by platform/version. ---
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 256k;

    # /devices/pair is reachable with no client cert (a brand-new phone has
    # none yet) -- rate limit it specifically. Defense-in-depth alongside the
    # relay's own per-request logic; the pairing code's entropy + short TTL
    # are the primary defense (see docs/improvement-ideas.md).
    location = /devices/pair {
        limit_req zone=term_bridge_device_pair burst=5 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host                  $host;
        proxy_set_header X-Forwarded-For       $remote_addr;
        proxy_set_header X-Client-Cert-CN      $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verify  $ssl_client_verify;
        # proxy_set_header X-Edge-Token        "CHANGE_ME_edge_secret";  # if edge_token is set
    }

    # /debug/vars (internal/metrics) is meant for an operator on the home
    # server curling the relay's loopback address directly, never for the
    # public internet -- it has no auth of its own (expvar has no concept of
    # one) and would otherwise leak per-tenant request/pairing/push counts,
    # plus Go's own cmdline/memstats, to anyone who can reach this vhost. An
    # exact-match location always wins over the `location /` catch-all below
    # regardless of declaration order, so this holds even though it's listed
    # first for readability.
    location = /debug/vars {
        deny all;
        return 403;
    }

    # The relay distinguishes the Mac agent from app devices by client-cert CN.
    # Always SET (never trust an inbound) X-Client-Cert-CN and
    # X-Client-Cert-Verify from the verified DN/verification result, so a
    # client cannot spoof either; the relay parses the CN= component and
    # requires Verify == "SUCCESS" before trusting any agent CN.
    location / {
        # If nginx is on a DIFFERENT host than the relay, proxy to the relay's
        # LAN address (e.g. http://192.168.1.160:8765) and set edge_token in the
        # relay config + the X-Edge-Token header below, so only nginx can drive
        # the relay. If nginx is local, http://127.0.0.1:8765 with no edge token.
        proxy_pass http://127.0.0.1:8765;

        proxy_http_version 1.1;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection            $connection_upgrade;
        proxy_set_header Host                  $host;
        proxy_set_header X-Forwarded-For       $remote_addr;
        proxy_set_header X-Client-Cert-CN      $ssl_client_s_dn;      # relay parses CN=…
        proxy_set_header X-Client-Cert-Verify  $ssl_client_verify;    # SUCCESS | FAILED:<reason> | NONE
        # proxy_set_header X-Edge-Token        "CHANGE_ME_edge_secret";  # if edge_token is set

        # The agent tunnel (/agent/tunnel) and terminal/event WebSockets are
        # long-lived.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
