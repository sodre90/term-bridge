# Separate, no-client-cert-required surface for brand-new agents that have no
# identity yet — a fresh agent can't present a cert it doesn't have, so it
# can't reach the main mTLS vhost in nginx-term-bridge-relay.conf at all. This vhost
# proxies ONLY /tenants/register; everything else 404s. The main vhost keeps
# ssl_verify_client optional, unchanged, for both the agent tunnel and all
# device traffic.
#
# Rate limiting / abuse resistance for this endpoint: nginx's limit_req below
# plus the relay's own per-IP throttle and global tenant cap
# (internal/relay/relay.go's registerLimiter / maxTenants).
#
# This `limit_req_zone` must live in the http{} context:
#
#   limit_req_zone $binary_remote_addr zone=term_bridge_tenant_register:10m rate=6r/m;
server {
    listen 8444 ssl;
    http2 on;
    server_name term-bridge.example.com;

    ssl_certificate     /etc/nginx/certs/term-bridge/server.crt;
    ssl_certificate_key /etc/nginx/certs/term-bridge/server.key;
    # Deliberately no ssl_client_certificate / ssl_verify_client here.

    # --- TLS hardening: pin modern protocols/ciphers instead of relying on
    # nginx build defaults, which vary by platform/version. ---
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 16k;   # CSRs are a few hundred bytes

    location = /tenants/register {
        limit_req zone=term_bridge_tenant_register burst=3 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # proxy_set_header X-Edge-Token "CHANGE_ME_edge_secret";  # if edge_token is set — same secret as the main vhost
    }

    location / {
        return 404;
    }
}
