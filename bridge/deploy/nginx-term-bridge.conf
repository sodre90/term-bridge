# Sample nginx vhost for term-bridge on your Home Assistant edge.
# Terminates mutual TLS and reverse-proxies to the Mac running term-bridge.
#
# This `map` must live in the http{} context (not inside server{}). It lets the
# same vhost proxy both plain HTTP and WebSocket upgrades.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 443 ssl;
    http2 on;
    server_name term-bridge.example.com;          # your dedicated DNS name

    # --- Server certificate (edge) ---
    ssl_certificate     /etc/nginx/certs/term-bridge/server.crt;
    ssl_certificate_key /etc/nginx/certs/term-bridge/server.key;

    # --- Mutual TLS: require a client certificate signed by your CA ---
    ssl_client_certificate /etc/nginx/certs/term-bridge/client-ca.crt;
    ssl_verify_client      on;             # reject anyone without a valid client cert

    # --- TLS hardening: pin modern protocols/ciphers instead of relying on
    # nginx build defaults, which vary by platform/version. ---
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Optional: cap body size; the bridge API bodies are tiny.
    client_max_body_size 256k;

    location / {
        # The Mac's LAN address and the bridge's listen port (config.toml).
        proxy_pass http://192.0.2.10:8765;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Client-Cert-CN   $ssl_client_s_dn;   # for audit logs

        # Terminal/event WebSockets are long-lived.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
