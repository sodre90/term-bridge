# term-bridge-relay config (home server). Copy to /etc/term-bridge-relay/config.toml.
#
# ca_cert/ca_key are set explicitly below (rather than left to default under
# ~/.config/term-bridge-relay) because deploy/term-bridge-relay.service runs with
# ProtectSystem=strict + StateDirectory=term-bridge-relay: only /var/lib/term-bridge-relay
# is writable, so a ~/.config default would fail to create the CA on first
# run. If you're running term-bridge-relay outside that unit (no hardening), the
# ~/.config default is fine and these two lines are unnecessary.
listen      = "127.0.0.1:8765"                 # loopback; nginx is the edge
token_store = "/var/lib/term-bridge-relay/store.db"
relay_token = "CHANGE_ME_long_random_secret"    # shared with the Mac agent
edge_token  = ""                                # if nginx is on another host: a secret it must send in X-Edge-Token (empty = off, for a loopback relay)
ca_cert     = "/var/lib/term-bridge-relay/ca.crt"      # the relay's own CA, auto-created on first run if absent
ca_key      = "/var/lib/term-bridge-relay/ca.key"

# Push (optional): leave the sender pair (fcm_project_id + fcm_credentials)
# empty to disable sending.
# fcm_project_id  = "your-firebase-project-id"
# fcm_credentials = "/etc/term-bridge-relay/fcm-service-account.json"
# The client half, handed to a phone at pairing so the app can initialise FCM
# without a google-services.json compiled into it. Read them out of the
# google-services.json for the Android app whose package_name is
# com.sodre90.cmuxremote (a project with several apps has several entries):
#   fcm_project_id <- project_info.project_id
#   fcm_sender_id  <- project_info.project_number
#   fcm_app_id     <- client[].client_info.mobilesdk_app_id
#   fcm_api_key    <- client[].api_key[0].current_key
# App ID and Sender ID are also in the Firebase console (Project settings ->
# General / Cloud Messaging); the Android API key is not -- the console's
# project-level "Web API Key" is a different key.
# All four must be set or the block is not sent -- Firebase rejects a partial
# set, and the bridge warns at startup when it finds one. Not secrets: every
# push-enabled APK ships them in the clear.
# Sending still needs fcm_credentials, which never leaves this machine.
# fcm_app_id     = "1:1234567890:android:abcdef1234567890"
# fcm_api_key    = "AIzaSy..."
# fcm_sender_id  = "1234567890"

# Secrets and listen address may instead (or additionally) be supplied via
# environment variables, which win over whatever this file sets -- handy for
# a container orchestrator's secret store instead of a checked-in file:
#   CMUX_RELAY_TOKEN, CMUX_RELAY_EDGE_TOKEN, CMUX_RELAY_FCM_CREDENTIALS,
#   CMUX_RELAY_LISTEN
